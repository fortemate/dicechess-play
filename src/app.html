<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta id="theme-color-meta" name="theme-color" content="#17231d" />
		<!-- Fortemate identity assets (#65): verbatim copies of fortemate/brand dist/identity/web at
		     brand commit d1faf10. Regenerate there, never edit here; the name stays live text. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />
		<!-- The default-head block is the site-wide fallback metadata (#254). Crawlers and
		     unfurl bots do not run JS, so every route served by the SPA fallback — the landing
		     page included — unfurls from exactly these tags. The prerendered content page
		     (/rules) carries its own <title>/description/OG via <svelte:head>;
		     src/hooks.server.ts strips this block from its HTML at build time so the head
		     holds one set of tags, not two. Keep the marker comments intact. -->
		<!-- default-head -->
		<title>Dice Chess for Fire TV — The Living Room Chess Game</title>
		<meta
			name="description"
			content="Dice Chess for Amazon Fire TV: family chess with a roll of the dice, built for the living room. Share one remote, or take on three computer opponents with voice acting. Available now on the Amazon Appstore."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Dice Chess" />
		<meta property="og:title" content="Dice Chess for Fire TV — The Living Room Chess Game" />
		<meta
			property="og:description"
			content="Family chess with a roll of the dice, built for Fire TV. Share one remote, or challenge three computer opponents. Available now on the Amazon Appstore."
		/>
		<meta property="og:url" content="https://fortemate.com/" />
		<meta property="og:image" content="https://fortemate.com/social-preview-1200x630.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Dice Chess for Fire TV" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- /default-head -->
		<!-- appearance-bootstrap (#249): sets data-theme and the theme-color meta before first
		     paint, so nobody sees the wrong theme while the bundle loads. Inline and module-free
		     on purpose: a module would run after first paint. It therefore REPEATS values owned
		     by src/lib/appearance.ts: the storage key, the media query, the legacy editor themes
		     that migrate to dark, and the two meta colours. src/appearanceBootstrap.test.ts runs
		     this exact source against every one of them, so changing either side alone fails CI.
		     Read-only: rewriting a legacy stored value is themeStore's job. -->
		<script>
			(function () {
				var stored = null;
				try {
					stored = localStorage.getItem('dicechess-theme');
				} catch {
					// Storage can be unavailable (privacy modes, sandboxed frames): follow the system.
				}
				var systemLight = false;
				try {
					systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
				} catch {
					// Dark is the fallback when the system setting cannot be read.
				}
				var legacyDark = ['dracula', 'nord', 'solarized-dark', 'tokyo-night', 'gruvbox'];
				var theme = 'dark';
				if (stored === 'light' || stored === 'dark') {
					theme = stored;
				} else if (!legacyDark.includes(stored) && systemLight) {
					theme = 'light';
				}
				document.documentElement.dataset.theme = theme;
				var meta = document.getElementById('theme-color-meta');
				if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f4ed' : '#17231d');
			})();
		</script>
		<!-- boot-watchdog (#223): self-heal a client wedged by a poisoned service worker or
		     HTTP cache. A deploy burst can leave workbox's precache holding the SPA fallback
		     (200 + HTML) under hash-named JS URLs; such a client white-screens on every load
		     and never recovers on its own — the poisoned manifest is already the newest, and
		     the app never boots far enough for src/lib/staleBundleRecovery.ts to run. Inline
		     and module-free on purpose: it must keep working when every module import fails.
		     It only ever touches service workers and Cache Storage — never localStorage or
		     IndexedDB, which hold the guest identity and the local game history. -->
		<script>
			(function (w) {
				'use strict';
				var KEY = 'dicechess-play-boot-watchdog';
				var BOOT_FAILURE = /dynamically imported module|importing a module script failed/i;
				function shouldHeal(reason) {
					if (w.__dcBooted) return false;
					if (!BOOT_FAILURE.test(String((reason && reason.message) || reason || ''))) return false;
					if (w.navigator && w.navigator.onLine === false) return false;
					try {
						var last = Number(w.sessionStorage.getItem(KEY) || '0');
						if (Date.now() - last < 60000) return false;
						w.sessionStorage.setItem(KEY, String(Date.now()));
					} catch {
						return false; // no storage means no loop guard, so never auto-reload
					}
					return true;
				}
				function swallow(p) {
					return p.catch(function () {});
				}
				function heal() {
					var steps = [];
					if (w.navigator && w.navigator.serviceWorker) {
						steps.push(
							swallow(
								w.navigator.serviceWorker.getRegistrations().then(function (regs) {
									return Promise.all(
										regs.map(function (r) {
											return r.unregister();
										}),
									);
								}),
							),
						);
					}
					if (w.caches) {
						steps.push(
							swallow(
								w.caches.keys().then(function (names) {
									return Promise.all(
										names.map(function (n) {
											return w.caches.delete(n);
										}),
									);
								}),
							),
						);
					}
					steps.push(
						swallow(
							w
								.fetch('/', { cache: 'reload' })
								.then(function (r) {
									return r.text();
								})
								.then(function (html) {
									var urls = html.match(/_app\/immutable\/[^"']+/g) || [];
									var unique = urls.filter(function (u, i) {
										return urls.indexOf(u) === i;
									});
									return Promise.all(
										unique.slice(0, 60).map(function (u) {
											return swallow(w.fetch('/' + u, { cache: 'reload' }));
										}),
									);
								}),
						),
					);
					Promise.all(steps).then(function () {
						w.location.reload();
					});
				}
				w.addEventListener('unhandledrejection', function (event) {
					if (shouldHeal(event && event.reason)) heal();
				});
			})(window);
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-background text-content min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
