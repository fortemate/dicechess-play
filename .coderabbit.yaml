# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =============================================================================
# CodeRabbit Configuration — Dice Chess play site (SvelteKit 2 / Svelte 5)
# =============================================================================
# Client-side SPA for Dice Chess: vs-bot play (Web Worker) & live play.
# Pure frontend: TypeScript strict + Svelte 5 runes + Tailwind v4 + Vite.
# =============================================================================

language: en-US

reviews:
  profile: assertive

  high_level_summary: false
  poem: false
  collapse_walkthrough: true

  auto_review:
    # Reviews are triggered manually with an "@coderabbitai review" comment.
    enabled: false
    drafts: false
    base_branches:
      - main

  path_filters:
    - '!**/node_modules/**'
    - '!**/.svelte-kit/**'
    - '!**/dist/**'
    - '!**/*.lock'

  tools:
    actionlint:
      enabled: true # Validate GitHub Actions workflow YAML
    gitleaks:
      enabled: true # Detect leaked secrets (complements the pre-commit hook)
    shellcheck:
      enabled: true # Lint shell scripts
    markdownlint:
      enabled: true # Validate documentation formatting

  path_instructions:
    - path: 'src/**/*.{svelte,ts}'
      instructions: |
        Svelte 5 runes and TypeScript strict conventions:
        - Svelte 5 runes ONLY: $state, $derived, $effect, $props. Legacy export let and reactive statements ($:) are forbidden.
        - Global stores are singleton classes in *.svelte.ts files.
        - Live vs. Viewed state separation: game logic must always read private live state, never presentation getters that switch during history scrubbing.
        - Ingest contracts: GameIngestWire is snake_case and must match the shared analytics schema verbatim.

    - path: '.github/workflows/**'
      instructions: |
        CI/CD for SvelteKit static bundle deploying to Cloudflare Pages:
        - Ensure NODE_AUTH_TOKEN / packages:read is present for installing @fortemate/dicechess-engine.
        - Keep secrets safe and isolated from untrusted PR runs.
