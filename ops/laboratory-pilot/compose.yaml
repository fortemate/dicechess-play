services:
  gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: '10001:10001'
    read_only: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_DATA_HOME: /tmp/caddy/data
      XDG_CONFIG_HOME: /tmp/caddy/config
    ports:
      - '127.0.0.1:${LAB_FRONTEND_PORT:-8443}:8443'
      - '127.0.0.1:${LAB_API_PORT:-9443}:9443'
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${LAB_FRONTEND_DIR:?Set LAB_FRONTEND_DIR to the absolute path of the built frontend artifact}
        target: /srv
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - lab_tls_cert
      - lab_tls_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777,uid=10001,gid=10001
    networks:
      - edge
      - ingress
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'SSL_CERT_FILE=/run/secrets/lab_tls_cert wget -q -O /dev/null https://localhost:8443/ || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ghcr.io/fortemate/dicechess-play-api@sha256:b37cc8afa7c78c4cead049eab1214085c871944c3cdae5d380808327c9c935ff
    user: '10001:10001'
    entrypoint: ['/bin/sh', '/pilot/api-entrypoint.sh']
    read_only: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PLAY_RUNTIME_MODE: laboratory
      LAB_DB_URL: jdbc:postgresql://db:5432/laboratory
      LAB_DB_USER: laboratory_app
      LAB_BIND_HOST: 0.0.0.0
      LAB_PORT: '8081'
      LAB_DB_POOL_SIZE: '2'
      LAB_RETENTION_DAYS: ${LAB_RETENTION_DAYS:-30}
      LAB_JOIN_WINDOW_SECONDS: ${LAB_JOIN_WINDOW_SECONDS:-300}
      LAB_PRUNE_INTERVAL_SECONDS: ${LAB_PRUNE_INTERVAL_SECONDS:-3600}
      LAB_PRUNE_BATCH_SIZE: ${LAB_PRUNE_BATCH_SIZE:-100}
      LAB_ADMISSION_OPEN: ${LAB_ADMISSION_OPEN:-false}
      LAB_FRONTEND_ORIGIN: ${LAB_FRONTEND_ORIGIN:?Set LAB_FRONTEND_ORIGIN to the HTTPS frontend origin}
    volumes:
      - type: bind
        source: ./api-entrypoint.sh
        target: /pilot/api-entrypoint.sh
        read_only: true
    secrets:
      - laboratory_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777,uid=10001,gid=10001
    networks:
      - database
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8081/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    user: '70:70'
    read_only: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
    volumes:
      - laboratory-data:/var/lib/postgresql
      - type: bind
        source: ./init-database.sql
        target: /docker-entrypoint-initdb.d/10-laboratory.sql
        read_only: true
    secrets:
      - source: laboratory_password
        target: laboratory_password
      - source: postgres_admin_password
        target: postgres_admin_password
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,size=8m,mode=755,uid=70,gid=70
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777,uid=70,gid=70
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  laboratory-data:

networks:
  database:
    internal: true
  edge:
    internal: true
  # Docker needs a non-internal bridge to publish the gateway's loopback ports.
  # Only the gateway joins it; application and database networks remain internal.
  ingress:
    internal: false

secrets:
  laboratory_password:
    file: ${LAB_DATABASE_PASSWORD_FILE:?Set LAB_DATABASE_PASSWORD_FILE to the app password file path}
  postgres_admin_password:
    file: ${LAB_DATABASE_ADMIN_PASSWORD_FILE:?Set LAB_DATABASE_ADMIN_PASSWORD_FILE to the PostgreSQL admin password file path}
  lab_tls_cert:
    file: ${LAB_TLS_CERT_FILE:?Set LAB_TLS_CERT_FILE to the TLS certificate file path}
  lab_tls_key:
    file: ${LAB_TLS_KEY_FILE:?Set LAB_TLS_KEY_FILE to the TLS private key file path}
