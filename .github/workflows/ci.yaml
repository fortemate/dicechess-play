name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci
        env:
          # Resolves @fortemate/dicechess-engine from the GitHub npm registry (.npmrc)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (svelte-check + tsc)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Everything above this line tests source. This tests what actually ships: the smoke drives
      # the built dist/ through `vite preview` and plays a real move. vitest never bundles the
      # Scala.js engine, so without this a bundler that miscompiles it reaches production with a
      # fully green pipeline — which is exactly how #185 happened.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built bundle
        run: npm run test:e2e

      - name: Upload smoke failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
