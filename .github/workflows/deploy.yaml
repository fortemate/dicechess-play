name: 'Ops: Deploy (Cloudflare Pages)'

# Builds in GitHub Actions (where @fortemate/dicechess-engine installs via GITHUB_TOKEN) and uploads
# the static dist/ to a Cloudflare Pages "Direct Upload" project. The browser never needs the engine
# token; Cloudflare never needs a packages PAT.
#
# Two destinations, one build path:
#   push to main / manual dispatch -> the production branch, i.e. fortemate.com
#   pull request                   -> a per-branch PREVIEW deployment on *.pages.dev, commented
#                                     on the PR, so the real production bundle is reviewable
#                                     before it is merged (#187)
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read # GITHUB_TOKEN needs this to install @fortemate/dicechess-engine
  pull-requests: write # to comment the preview URL on the PR

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Fork PRs and Dependabot PRs cannot see ordinary Actions secrets. A preview would fail before
    # reaching Cloudflare for a reason neither contributor can fix, so skip it rather than handing
    # a production deployment credential to Dependabot; CI still covers the dependency update.
    # Test the PR author rather than github.actor: a maintainer can re-run a Dependabot workflow,
    # but that must not change its secret boundary.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # Public URL of the play-api (live HvH + finished-game recording via POST
          # /ingest/games). Baked in here because the bundle is built in Actions and
          # Direct-Uploaded — a Cloudflare Pages *dashboard* variable would never reach
          # vite build. Override via a repo VARIABLE (vars.VITE_PLAY_API_URL); empty =
          # /live disabled AND recording disabled (games stay in IndexedDB).
          #
          # Previews point at the SAME play-api as production. In practice, though, production's
          # PLAY_CORS_ORIGINS is pinned to https://fortemate.com (measured: a preview origin gets no
          # Access-Control-Allow-Origin at all), so the browser blocks every play-api call from a
          # preview. A preview therefore reviews /play — the client-side vs-bot surface, and the one
          # that broke in #185 — while /lobby, /live, /bots, /leaderboard, the server half of /games
          # and finished-game recording stay empty on it.
          #
          # Widening that is a play-api change, not a knob here: Cors.policy matches origins by
          # exact string, and Cloudflare mints a new *.pages.dev host per deployment, so there is no
          # allow-list entry to add. Leaving it pinned is the current, deliberate choice.
          #
          # Isolating previews from the production API would need a real branch here, NOT an empty
          # repo variable: `||` treats '' as falsy, so an empty vars.VITE_PLAY_API_URL silently
          # yields the production URL.
          VITE_PLAY_API_URL: ${{ vars.VITE_PLAY_API_URL || 'https://api.fortemate.com' }}

      # wrangler pages deploy does not auto-create the project; create it once
      # (no-op / harmless error if it already exists, hence `|| true`).
      - name: Ensure Pages project exists
        run: npx --yes wrangler pages project create dicechess-play --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare decides production vs preview purely from --branch: the project's production
      # branch (main) deploys to the live site, anything else becomes a preview deployment.
      #
      # A branch name is attacker-influenced text, so it goes through `env` and is referenced as a
      # shell variable — never interpolated into the script body, where `${{ }}` would splice it in
      # before bash ever sees it and a crafted name could run commands.
      - name: Resolve deploy branch
        id: target
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf 'branch=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            printf 'branch=main\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dicechess-play --branch=${{ steps.target.outputs.branch }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The alias URL is per-BRANCH and therefore stable across pushes, so the comment's link
          # keeps working as the PR moves; `deployment-url` is per-deployment and goes stale.
          # Fall back to it anyway — an aliasless deploy should still leave a usable link.
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body \
            "🔍 **Preview**: ${PREVIEW_URL}

          The production bundle for \`${BRANCH}\`, built exactly as it would deploy. Updated on every push to this PR."
